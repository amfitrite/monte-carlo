name: Python tests

on:
  push:
    branches: [main, feature/enhanced-ohcl-v2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip numpy
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile engine_v2.py analyzer.py gui.py timemachine.py
