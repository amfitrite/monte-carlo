name: Python tests

on:
  push:
    branches: [main, feature/enhanced-ohcl-v2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependencies for GUI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Run tests with virtual display
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Verify compilation
        run: python -m py_compile engine_v2.py analyzer.py gui.py timemachine.py
